<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réservation - Voyage Fiesta</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: {
                        brand: {
                            blue: '#025091',
                            orange: '#F26522',
                            dark: '#1F2937',
                            light: '#F3F7FA'
                        }
                    }
                }
            }
        };
    </script>
    <style>
        body {
            background:
                radial-gradient(900px 420px at 8% -10%, rgba(2, 80, 145, 0.08), transparent 55%),
                radial-gradient(700px 380px at 110% 8%, rgba(242, 101, 34, 0.08), transparent 50%),
                #F3F7FA;
        }
        @media (prefers-reduced-motion: reduce) {
            body { background: #F3F7FA; }
        }
    </style>
</head>
<body class="text-gray-800 font-sans min-h-screen">
    <header class="bg-brand-blue text-white py-6 px-4">
        <div class="max-w-3xl mx-auto">
            <p class="text-xs uppercase tracking-widest text-white/70 mb-1">Voyage Fiesta</p>
            <h1 class="text-2xl font-bold">Formulaire de réservation</h1>
            <p id="rr-page-lead" class="text-sm text-white/80 mt-1">Coordonnées du voyageur principal, autres voyageurs et notes — envoyées à votre dossier Voyage Fiesta.</p>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">
        <div id="room-form-root"></div>
        <div id="room-submit-status" class="hidden mt-6 rounded-2xl border border-gray-200 bg-white p-8 text-center shadow-sm">
            <p id="room-submit-status-text" class="font-medium text-brand-blue">Envoi de votre demande…</p>
            <p class="text-sm text-gray-500 mt-2">Veuillez patienter quelques secondes.</p>
        </div>
    </main>

    <script src="config.js?v=49"></script>
    <script src="room-registration.js?v=16"></script>
    <script>
        (function () {
            RoomRegistration.injectStyles();
            const params = new URLSearchParams(window.location.search);
            const draft = RoomRegistration.loadReservationDraft(params.get('sid')) || {};
            const adults = Number(draft.adults || params.get('adults') || params.get('nombre_passagers') || 2) || 2;
            const kids = Number(draft.kids || params.get('kids') || params.get('enfants') || 0) || 0;
            const depositPerPerson = draft.depositPerPerson != null
                ? draft.depositPerPerson
                : (params.get('depot_par_personne') || params.get('deposit') || null);
            const formRoot = document.getElementById('room-form-root');
            const submitStatus = document.getElementById('room-submit-status');
            const submitStatusText = document.getElementById('room-submit-status-text');
            const lead = document.getElementById('rr-page-lead');

            if (draft.productName && lead) {
                lead.textContent = draft.summaryText || draft.productName;
                document.title = 'Réservation — ' + draft.productName;
            }

            function esc(s) {
                return String(s || '')
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;');
            }
            const summaryHtml = draft.summaryText
                ? `<strong>Forfait :</strong> ${esc(draft.summaryText)}`
                : '';

            RoomRegistration.mountForm(formRoot, {
                initialPassengerCount: Math.min(5, Math.max(1, adults)),
                initialKidsCount: Math.min(4, Math.max(0, kids)),
                depositPerPerson: depositPerPerson != null ? Number(depositPerPerson) : null,
                pricingSummary: draft.pricingSummary || '',
                summaryHtml,
                async onSubmit({ payload }) {
                    const slug = draft.productSlug || params.get('forfait_slug') || '';
                    const thankYou = draft.thankYouUrl || (typeof buildGhlThankYouUrl === 'function'
                        ? buildGhlThankYouUrl(slug)
                        : 'thank-you.html');
                    const merged = RoomRegistration.mergeReservationPayload(payload, draft);
                    formRoot.classList.add('hidden');
                    if (submitStatusText) submitStatusText.textContent = 'Envoi de votre demande…';
                    submitStatus.classList.remove('hidden');
                    try {
                        await RoomRegistration.submitGhlRoomForm({
                            payload: merged,
                            redirectUrl: thankYou
                        });
                    } catch (err) {
                        formRoot.classList.remove('hidden');
                        submitStatus.classList.add('hidden');
                        alert(err?.message
                            ? `Impossible d'envoyer la demande : ${err.message}`
                            : 'Impossible d\'envoyer la demande. Veuillez réessayer.');
                    }
                }
            });
        })();
    </script>
</body>
</html>
