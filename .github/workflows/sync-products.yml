name: Sync GHL Products

# Intervalle minimal GitHub Actions = 5 min.
# Note: les cron GitHub peuvent être retardés sous charge; utiliser « Run workflow »
# pour une sync immédiate après une modif GHL urgente.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-products
  # Ne pas annuler une sync en cours (téléchargement images) — la suivante attend.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync products from GoHighLevel
        id: sync
        env:
          GHL_API_KEY: ${{ secrets.GHL_API_KEY }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          GHL_OBJECT_SCHEMA_KEY: ${{ secrets.GHL_OBJECT_SCHEMA_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          node scripts/sync-ghl-products.mjs
          node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('products.json', 'utf8');
            const data = JSON.parse(raw);
            const products = data.products || [];
            if (!Array.isArray(products)) throw new Error('products.json: products is not an array');
            const byState = {};
            for (const p of products) {
              const s = p.state || p.active || '?';
              byState[s] = (byState[s] || 0) + 1;
              if (!p.slug) throw new Error('Product missing slug: ' + (p.name || p.id));
            }
            console.log('OK products.json —', products.length, 'forfait(s)', JSON.stringify(byState));
            console.log('updatedAt', data.updatedAt || '(none)');
          "

      - name: Commit and push if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths=()
          for p in products.json agents.json assets/forfaits share; do
            if [ -e "$p" ]; then
              paths+=("$p")
            fi
          done
          git add -- "${paths[@]}"

          if git diff --staged --quiet; then
            echo "No changes to products.json, agents.json, share pages or images"
            exit 0
          fi

          json_changed="$(git diff --staged -- products.json agents.json || true)"
          json_real="$(printf '%s\n' "$json_changed" | grep -E '^[+-]' | grep -vE '^[+-]{3} ' | grep -vE '^[+-] *"updatedAt":' || true)"
          other_change="$(git diff --staged --name-only | grep -vE '^(products|agents)\.json$' || true)"
          if [ -z "$json_real" ] && [ -z "$other_change" ]; then
            echo "Only updatedAt changed — skipping commit"
            git restore --staged --worktree -- products.json agents.json
            exit 0
          fi

          git commit -m "chore: sync products from GoHighLevel [skip ci]"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge origin/main --no-edit -X ours; then
              echo "Merge conflict — keeping synced products.json and images"
              git checkout --ours -- products.json agents.json || true
              git add -- "${paths[@]}"
              git commit --no-edit || true
            fi
            if git push origin main; then
              echo "Pushed sync — GitHub Pages should update within ~1–2 minutes."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}/5) — retrying..."
            sleep $((attempt * 2))
          done

          echo "Push failed after retries" >&2
          exit 1
