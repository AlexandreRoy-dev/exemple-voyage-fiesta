name: Groupes Atrium

on:
  push:
    paths:
      - 'groupes/**'
      - 'server/atrium-sync/**'
      - 'server/reservation-api/**'
      - 'scripts/deploy-reservation-api-vps.py'
      - '.github/workflows/groupes-tests.yml'
      - 'lead-ref.js'
      - 'agent-resolve.js'
      - 'tests/lead-ref.test.mjs'
      - 'tests/agent-resolve.test.mjs'
      - 'scripts/ghl-voyages-fields.mjs'
      - 'scripts/ghl-voyages-fields.test.mjs'
      - 'scripts/sync-ghl-products.mjs'
  pull_request:
    paths:
      - 'groupes/**'
      - 'server/atrium-sync/**'
      - 'server/reservation-api/**'
      - 'scripts/deploy-reservation-api-vps.py'
      - '.github/workflows/groupes-tests.yml'
      - 'lead-ref.js'
      - 'agent-resolve.js'
      - 'tests/lead-ref.test.mjs'
      - 'tests/agent-resolve.test.mjs'
      - 'scripts/ghl-voyages-fields.mjs'
      - 'scripts/ghl-voyages-fields.test.mjs'
      - 'scripts/sync-ghl-products.mjs'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Catalog, sync and reservation tests
        run: >-
          node --test --test-concurrency=1
          server/reservation-api/server.test.mjs
          server/atrium-sync/map.test.mjs
          server/atrium-sync/sync.test.mjs
          groupes/js/catalog.test.mjs
          tests/lead-ref.test.mjs
          tests/agent-resolve.test.mjs
          scripts/ghl-voyages-fields.test.mjs
